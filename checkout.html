<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | NovaMart</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">Nova<span>Mart</span></a><nav><a href="products.html">Products</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a></nav></header><main class="page"><h1>Checkout</h1><div id="checkout"></div></main><script src="assets/js/store.js"></script><script>const c=NovaStore.getCart(),el=document.getElementById('checkout');if(!c.length){el.innerHTML='<section class="empty"><h2>No items to checkout</h2><a class="btn" href="index.html">Shop now</a></section>'}else{el.innerHTML=`<div class="checkout-grid"><form class="panel" id="form"><h2>Delivery details</h2><label>Full name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Phone<input name="phone" type="tel" required autocomplete="tel"></label><label>Address<textarea name="address" rows="4" required></textarea></label><h3>Payment</h3><p class="notice">Demo checkout: no card details are collected or stored. Connect a real payment provider for production payments.</p><label><input type="radio" checked> Cash on delivery / demo payment</label><button class="btn full" type="submit">Place order · ${NovaStore.money(NovaStore.cartTotal())}</button></form><aside class="summary"><h2>Your order</h2>${c.map(x=>`<p><span>${x.name} × ${x.qty}</span><b>${NovaStore.money(x.price*x.qty)}</b></p>`).join('')}<hr><p class="total"><span>Total</span><b>${NovaStore.money(NovaStore.cartTotal())}</b></p></aside></div>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const order=NovaStore.placeOrder({name:f.get('name'),email:f.get('email'),phone:f.get('phone'),address:f.get('address')});location.href='orders.html?new='+encodeURIComponent(order.id)}};</script></body></html>
