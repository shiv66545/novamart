<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | NovaMart</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">Nova<span>Mart</span></a><nav><a href="products.html">Products</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a></nav></header><main class="page"><h1>Your Cart</h1><div id="cart"></div></main><script src="assets/js/store.js"></script><script>function render(){const c=NovaStore.getCart(),el=document.getElementById('cart');if(!c.length){el.innerHTML='<section class="empty"><h2>Your cart is empty</h2><p>Add something you like from NovaMart.</p><a class="btn" href="index.html">Continue shopping</a></section>';return}el.innerHTML=`<div class="cart-page"><div>${c.map(x=>`<article class="cart-row"><div class="mini-icon">${x.icon}</div><div class="cart-info"><h3>${x.name}</h3><p>${NovaStore.money(x.price)}</p><div class="qty"><button onclick="qty(${x.id},${x.qty-1})">−</button><b>${x.qty}</b><button onclick="qty(${x.id},${x.qty+1})">+</button><button class="link-btn" onclick="removeItem(${x.id})">Remove</button></div></div><strong>${NovaStore.money(x.price*x.qty)}</strong></article>`).join('')}</div><aside class="summary"><h2>Order summary</h2><p><span>Subtotal</span><b>${NovaStore.money(NovaStore.cartTotal())}</b></p><p><span>Delivery</span><b>Free</b></p><hr><p class="total"><span>Total</span><b>${NovaStore.money(NovaStore.cartTotal())}</b></p><a class="btn full" href="checkout.html">Proceed to checkout</a></aside></div>`}function qty(id,n){NovaStore.updateQty(id,n);render()}function removeItem(id){NovaStore.removeFromCart(id);render()}render();</script></body></html>
