<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | NovaMart</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">Nova<span>Mart</span></a><nav><a href="products.html">Products</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a></nav></header><main class="page"><h1>Your Orders</h1><div id="orders"></div></main><script src="assets/js/store.js"></script><script>const orders=NovaStore.getOrders(),el=document.getElementById('orders');if(!orders.length){el.innerHTML='<section class="empty"><h2>No orders yet</h2><p>Your completed demo orders will appear here.</p><a class="btn" href="index.html">Start shopping</a></section>'}else{el.innerHTML=orders.map(o=>`<article class="order-card"><div class="order-head"><div><b>${o.id}</b><small>${new Date(o.date).toLocaleString('en-IN')}</small></div><span class="status">${o.status}</span></div><div class="order-items">${o.items.map(x=>`<span>${x.icon} ${x.name} × ${x.qty}</span>`).join('')}</div><strong>Total: ${NovaStore.money(o.total)}</strong></article>`).join('')}</script></body></html>
