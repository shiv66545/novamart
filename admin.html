<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaMart Admin</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">Nova<span>Mart</span></a><nav><a href="index.html">Storefront</a><a href="products.html">Products</a><a href="orders.html">Orders</a></nav></header><main class="page"><div class="admin-head"><div><div class="eyebrow">Control center</div><h1>Admin dashboard</h1><p>Local demo management powered by browser storage.</p></div><button class="btn" onclick="resetDemo()">Reset demo data</button></div><div class="stats"><div class="stat"><span>Products</span><b id="products"></b></div><div class="stat"><span>Orders</span><b id="orders"></b></div><div class="stat"><span>Revenue</span><b id="revenue"></b></div></div><section class="panel"><h2>Orders</h2><div id="orderList"></div></section><section class="panel"><h2>Catalog</h2><div class="admin-products" id="catalog"></div></section></main><script src="assets/js/store.js"></script><script>function render(){const orders=NovaStore.getOrders();document.getElementById('products').textContent=NovaStore.products.length;document.getElementById('orders').textContent=orders.length;document.getElementById('revenue').textContent=NovaStore.money(orders.reduce((s,o)=>s+o.total,0));document.getElementById('orderList').innerHTML=orders.length?orders.map(o=>`<div class="admin-row"><div><b>${o.id}</b><small>${o.customer?.name||'Customer'} · ${new Date(o.date).toLocaleString('en-IN')}</small></div><strong>${NovaStore.money(o.total)}</strong></div>`).join(''):'<p>No orders yet.</p>';document.getElementById('catalog').innerHTML=NovaStore.products.map(p=>`<div class="admin-row"><div><b>${p.icon} ${p.name}</b><small>${p.category}</small></div><strong>${NovaStore.money(p.price)}</strong></div>`).join('')}function resetDemo(){if(confirm('Reset cart, wishlist and orders in this browser?')){localStorage.removeItem('novamart-cart');localStorage.removeItem('novamart-wishlist');localStorage.removeItem('novamart-orders');render()}}render();</script></body></html>
