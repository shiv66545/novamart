<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | NovaMart</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">Nova<span>Mart</span></a><nav><a href="products.html">Products</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a></nav></header><main class="page"><div id="productView"></div></main><script src="assets/js/store.js"></script><script>const id=new URLSearchParams(location.search).get('id');const p=NovaStore.getProduct(id);const el=document.getElementById('productView');if(!p){el.innerHTML='<section class="empty"><h1>Product not found</h1><a class="btn" href="index.html">Back to shop</a></section>'}else{el.innerHTML=`<section class="product-detail"><div class="product-visual">${p.icon}</div><div><div class="eyebrow">${p.category}</div><h1>${p.name}</h1><p class="rating">★ ${p.rating} / 5</p><h2>${NovaStore.money(p.price)}</h2><p>${p.description}</p><div class="detail-actions"><button class="btn" onclick="add()">Add to cart</button><button class="btn secondary" onclick="wish()">${NovaStore.isWishlisted(p.id)?'♥ Wishlisted':'♡ Add to wishlist'}</button></div></div></section>`}function add(){NovaStore.addToCart(p.id);location.href='cart.html'}function wish(){NovaStore.toggleWishlist(p.id);location.reload()}</script></body></html>
