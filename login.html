<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | NovaMart</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">Nova<span>Mart</span></a><nav><a href="products.html">Products</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a></nav></header><main class="auth-page"><section class="auth-card"><div class="eyebrow">NovaMart account</div><h1>Welcome back</h1><p>Create a local demo profile for this browser.</p><form id="auth"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><button class="btn full">Continue</button></form><p class="notice">This static demo does not store passwords or send credentials anywhere. Use a real authentication provider before deploying account features to production.</p></section></main><script>document.getElementById('auth').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);localStorage.setItem('novamart-user',JSON.stringify({name:f.get('name'),email:f.get('email')}));location.href='index.html'};</script></body></html>
