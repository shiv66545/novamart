<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | NovaMart</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="topbar"><a class="logo" href="index.html">Nova<span>Mart</span></a><nav><a href="products.html">Products</a><a href="wishlist.html">Wishlist</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a></nav></header><main class="page"><h1>Wishlist</h1><div class="product-grid" id="grid"></div></main><script src="assets/js/store.js"></script><script>const grid=document.getElementById('grid');function render(){const ps=NovaStore.products.filter(p=>NovaStore.getWishlist().includes(p.id));grid.innerHTML=ps.length?ps.map(p=>`<article class="product-card"><div class="product-image">${p.icon}</div><div class="eyebrow">${p.category}</div><h3>${p.name}</h3><p class="rating">★ ${p.rating}</p><strong>${NovaStore.money(p.price)}</strong><div class="card-actions"><a class="btn" href="products.html?id=${p.id}">View</a><button class="btn secondary" onclick="removeWish(${p.id})">Remove</button></div></article>`).join(''):'<section class="empty"><h2>Your wishlist is empty</h2><a class="btn" href="index.html">Explore products</a></section>'}function removeWish(id){NovaStore.toggleWishlist(id);render()}render();</script></body></html>
